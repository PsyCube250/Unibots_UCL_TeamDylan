[platformio]
default_envs = bluepill_f103c8

; This environment targets the common STM32F103C8 "Blue Pill" style board.
; If your exact STM32 board is different, change the board ID before upload.
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
monitor_speed = 115200
monitor_filters = time

; ST-Link/SWD: STM32 GND/SCK/DIO/3V3 -> ST-Link GND/SWCLK/SWDIO/3.3V.
upload_protocol = stlink
